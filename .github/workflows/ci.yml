# =============================================================================
# ci.yml — continuous integration of nobreak-omarchy
#
# shell job : shellcheck on every .sh + bash -n (syntax) on every shell script
#             (including core/autoheal/nobreak-autoheal)
# python job: pytest (core tests/ + drivers/*/tests) + each driver's --selftest
# =============================================================================
name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    name: Shell (shellcheck + bash -n)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: shellcheck on every .sh (install.sh, uninstall.sh, scripts/lib.sh)
        run: |
          mapfile -d '' shfiles < <(find . -name '*.sh' -print0)
          if (( ${#shfiles[@]} == 0 )); then
            echo "::error::no .sh found — checkout problem?"
            exit 1
          fi
          ec=0
          for f in "${shfiles[@]}"; do
            echo "::group::shellcheck -x $f"
            # -x: follows "source=" and also analyzes scripts/lib.sh
            shellcheck -x "$f" || ec=1
            echo "::endgroup::"
          done
          exit "$ec"

      - name: bash -n (syntax check) on every shell script
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n core/autoheal/nobreak-autoheal
          echo "bash -n: OK"

  python:
    name: Python 3.11 (pytest + driver selftests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (pytest pyusb pyserial)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyusb pyserial

      - name: Tests (core + drivers)
        run: pytest -q

      - name: Driver selftests (drivers/*/driver.py --selftest)
        run: |
          for d in drivers/*/driver.py; do
            [[ $d == drivers/_* ]] && continue
            echo "::group::$d --selftest"
            python "$d" --selftest
            echo "::endgroup::"
          done
