# =============================================================================
# ci.yml — Integração contínua do kit nobreak-mec0003
#
# shell job : shellcheck em todos os .sh + bash -n (sintaxe) em todos os .sh
# python job: pytest (tests/) + selftest do driver (mec0003.py --selftest)
# =============================================================================
name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    name: Shell (shellcheck + bash -n)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: shellcheck em todos os .sh (install.sh, uninstall.sh, scripts/lib.sh)
        run: |
          mapfile -d '' shfiles < <(find . -name '*.sh' -print0)
          if (( ${#shfiles[@]} == 0 )); then
            echo "::error::nenhum .sh encontrado — erro no checkout?"
            exit 1
          fi
          ec=0
          for f in "${shfiles[@]}"; do
            echo "::group::shellcheck -x $f"
            # -x: segue o "source=" e análise também o scripts/lib.sh
            shellcheck -x "$f" || ec=1
            echo "::endgroup::"
          done
          exit "$ec"

      - name: bash -n (validação de sintaxe) em todos os .sh
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
          echo "bash -n: OK"

  python:
    name: Python 3.11 (pytest + selftest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências (pytest pyusb pyserial)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyusb pyserial

      - name: Testes (pytest tests/ -q)
        run: |
          # Guarda: enquanto tests/ não tiver testes (repo em montagem),
          # pytest devolve 5 (no tests collected) — não é erro aqui.
          if compgen -G 'tests/test_*.py' > /dev/null; then
            pytest tests/ -q
          else
            echo "::warning::tests/ ainda não tem testes — nada a rodar."
          fi

      - name: Selftest do driver (mec0003.py --selftest)
        run: |
          if [[ -f mec0003.py ]]; then
            python mec0003.py --selftest
          else
            echo "::error::mec0003.py não encontrado na raiz do repo."
            exit 1
          fi
