# =============================================================================
# drivers/<name>/nut/ups.conf — the NUT section for this UPS.
#
# install.sh copies everything from the first [section] header down into
# /etc/nut/ups.conf, renaming the header to --name. If you set
# override.battery.packs, install.sh replaces its value with the one
# matching --battery (12 V -> 6, 24 V -> 12).
#
# Only commit options you verified on real hardware, and say why in a comment.
# =============================================================================

[nobreak]
    driver = usbhid-ups
    port = auto
    vendorid = 0000
    productid = 0000
    # pollinterval = 2
