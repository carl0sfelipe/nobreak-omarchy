# =============================================================================
# drivers/mec0003/nut/ups.conf — PROVEN /etc/nut/ups.conf section for UPSes
# with the MEC0003 USB chip (VID:PID 0001:0000, product "MEC0003").
#
# Working capture: drivers/mec0003/captures/2026-10-28-upsc-working.txt
# (NUT 2.8.5, nutdrv_qx "Q1 0.08" / internal 0.49). Tested live 2026-10-28
# on mains and on battery.
#
# install.sh --driver mec0003 writes this section (idempotently) into
# /etc/nut/ups.conf. It replaces the section name ([nobreak]) with --name
# and the battery.packs value with the one matching --battery (12 V -> 6,
# 24 V -> 12). Everything else is copied verbatim.
# =============================================================================

[nobreak]
    driver = nutdrv_qx
    port = auto
    vendorid = 0001
    productid = 0000
    product = MEC0003
    # Megatec (Q1) commands tunneled in USB string descriptors —
    # the "MEGA(USB)" mode of the UPSmart software shipped with these UPSes.
    subdriver = hunnox
    protocol = q1
    # The firmware does not negotiate langid: fixed 0x0409, no scanning
    # (the default scan was the cause of the I/O errors).
    langid_fix = 0x0409
    noscanlangid
    # Tight poll on purpose: after a replug the chip answers ZEROS until it
    # is polled at ~1 Hz for a few seconds — with pollinterval=2 the driver
    # settles in ~1 min.
    pollinterval = 2
    # battery.voltage is reported PER CELL (~2.22 V on float): 12 V -> 6, 24 V -> 12.
    override.battery.packs = 6
    battery_voltage_reports_one_pack
    # The LB flag from this firmware is unreliable (it can assert while the
    # battery is fine): ignore it and derive "low" from battery.charge.
    ignorelb
    override.battery.charge.low = 30
    # Voltage-based charge estimate for a 12 V lead-acid battery (per pack
    # after battery_voltage_reports_one_pack). NOTE: the estimate drops
    # ~25 points the moment the UPS goes on battery (voltage sag under load);
    # the UPS LCD shows its own, different percentage.
    default.battery.voltage.nominal = 12
    default.battery.voltage.high = 13.2
    default.battery.voltage.low = 10.4
