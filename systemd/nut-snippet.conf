# =============================================================================
# nut-snippet.conf — trecho de referência PROVADO de /etc/nut/ups.conf para
# nobreaks com chip USB MEC0003 (VID:PID 0001:0000, produto "MEC0003").
#
# Captura funcional em docs/capturas/2026-10-28-upsc-funcionando.txt
# (NUT 2.8.5, nutdrv_qx "Q1 0.08" / internal 0.49).
#
# NOTA: apesar de estar na pasta systemd/, NÃO é uma unit — é só o modelo do
# que o install.sh escreve (idempotente) no /etc/nut/ups.conf em --mode nut.
# =============================================================================

[nobreak]
    driver = nutdrv_qx
    port = auto
    vendorid = 0001
    productid = 0000
    product = MEC0003
    # Comandos Megatec (Q1) tunelados em descritores de string USB —
    # modo "MEGA(USB)" do software UPSmart que acompanha esses nobreaks.
    subdriver = hunnox
    protocol = q1
    # O firmware não negocia langid: 0x0409 fixo e sem varredura
    # (a varredura padrão era a causa do I/O error).
    langid_fix = 0x0409
    noscanlangid
    # Poll apertado de propósito: após replug o chip responde ZEROS até
    # haver polling ~1Hz por alguns segundos — com pollinterval=2 o
    # driver normaliza em ~1 min.
    pollinterval = 2
    # battery.voltage vem POR CÉLULA (~2.22V em float): 12V -> 6, 24V -> 12.
    battery.packs = 6
